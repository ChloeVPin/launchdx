name: macOS validation

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Validate schema and emitted report
        shell: bash
        run: |
          python3 -m json.tool Schemas/diagnosis-v1.json >/dev/null
          swift build -c release
          sh Scripts/test-schema.sh /tmp/launchdx-schema
      - name: Generate fixtures
        run: sh Scripts/make-fixtures.sh /tmp/launchdx-fixtures
      - name: Real macOS integration fixtures
        run: sh Scripts/integration-macos.sh /tmp/launchdx-real-integration
      - name: Diagnose fixture (expected unsigned blocker)
        shell: bash
        run: |
          set +e
          .build/release/launchdx diagnose /tmp/launchdx-fixtures/Valid.app --json > /tmp/launchdx-valid.json
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          with open('/tmp/launchdx-valid.json') as handle:
              report = json.load(handle)
          assert report['launchStatus'] == 'blocked'
          assert any(item['id'] in ('signature.unsigned', 'signature.invalid') for item in report['findings'])
          PY
